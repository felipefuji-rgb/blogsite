<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %} | Blogsite</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 0 16px; line-height: 1.5; }
        header { border-bottom: 1px solid #ccc; padding: 12px 0; margin-bottom: 20px; }
        header a { margin-right: 16px; text-decoration: none; font-weight: bold; }
        .data { color: #666; font-size: 0.9em; }
        .post-content img { max-width: 100%; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'posts:index' %}">Início</a>
        <a href="{% url 'posts:create' %}">Novo post</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
