{% extends 'base.html' %}

{% block title %}Editar: {{ post.title }}{% endblock %}

{% block content %}
<h1>Editar post</h1>
<form action="{% url 'posts:update' post.id %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>
<p><a href="{% url 'posts:detail' post.id %}">Cancelar</a></p>
{% endblock %}
