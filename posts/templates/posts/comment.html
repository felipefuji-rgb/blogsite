{% extends 'base.html' %}

{% block title %}Comentar: {{ post.title }}{% endblock %}

{% block content %}
<h1>Novo comentário</h1>
<p>Post: <a href="{% url 'posts:detail' post.id %}">{{ post.title }}</a></p>
<form action="{% url 'posts:comment' post.id %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Comentar</button>
</form>
{% endblock %}
