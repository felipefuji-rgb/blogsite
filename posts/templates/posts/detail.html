{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p class="data">Publicado em {{ post.date|date:"d/m/Y H:i" }}</p>
<div class="post-content">
    {{ post.content|safe }}
</div>
<p>
    <a href="{% url 'posts:update' post.id %}">Editar</a> |
    <a href="{% url 'posts:delete' post.id %}">Remover</a> |
    <a href="{% url 'posts:index' %}">Voltar para a lista</a>
</p>
{% endblock %}
